version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: taskDB
      POSTGRES_USER: Student
      POSTGRES_PASSWORD: 1769
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    depends_on:
      - db
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/taskDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SUPPORT_EMAIL: ${SPRING_MAIL_USERNAME}
      APP_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SELECTEL_S3_ACCESS_KEY: ${SELECTEL_S3_ACCESS_KEY}
      SELECTEL_S3_SECRET_KEY: ${SELECTEL_S3_SECRET_KEY}
      SELECTEL_S3_ENDPOINT: ${SELECTEL_S3_ENDPOINT}
      SELECTEL_S3_REGION: ${SELECTEL_S3_REGION}
      SELECTEL_S3_BUCKET_NAME: ${SELECTEL_S3_BUCKET_NAME}
      SELECTEL_S3_DOMAIN_NAME: ${SELECTEL_S3_DOMAIN_NAME}
      SERVER_SSL_ENABLED: "false"

volumes:
  postgres_data:
    driver: local
